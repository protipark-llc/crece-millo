name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Rol NO superusuario: los superusuarios se saltan RLS y las pruebas de aislamiento no serían reales.
      DATABASE_URL: postgres://crece:crece_ci@localhost:5432/crece_dev
      TEST_DATABASE_URL: postgres://crece:crece_ci@localhost:5432/crece_test
      E2E_DATABASE_URL: postgres://crece:crece_ci@localhost:5432/crece_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar bases de datos
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE crece WITH LOGIN PASSWORD 'crece_ci' CREATEDB;"
          for db in crece_dev crece_test crece_e2e; do psql -h localhost -U postgres -c "CREATE DATABASE $db OWNER crece;"; done
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Migraciones sobre base limpia
        run: npx tsx scripts/migrate.ts
      - run: npm run build
